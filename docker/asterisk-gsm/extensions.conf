[general]
static=yes
writeprotect=no
autofallthrough=yes
clearglobalvars=no
priorityjumping=no

[globals]
CONSOLE=Console/dsp
TRUNK=Zap/g2
TRUNKMSD=1

[default]
exten => s,1,Verbose(1,Incoming call to default context)
exten => s,n,Hangup()

[from-gsm]
; Incoming calls from GSM modem
exten => s,1,Answer()
exten => s,n,Wait(1)
exten => s,n,Playback(/var/lib/asterisk/sounds/ivr-greeting)
exten => s,n,Read(dtmf,/var/lib/asterisk/sounds/ivr-prompt,1)
exten => s,n,GotoIf($["${dtmf}"="1"]?yes:no)
exten => s,n(yes),Verbose(1,User pressed YES)
exten => s,n,System(echo "YES response from ${CALLERID(num)}" >> /var/log/asterisk/ivr-responses.log)
exten => s,n,Hangup()
exten => s,n(no),Verbose(1,User pressed NO or no response)
exten => s,n,System(echo "NO response from ${CALLERID(num)}" >> /var/log/asterisk/ivr-responses.log)
exten => s,n,Hangup()

[outbound-ivr]
; Outbound IVR context
exten => _X.,1,Verbose(1,Outbound call to ${EXTEN})
exten => _X.,n,Dongle(gsm1/${EXTEN},60)
exten => _X.,n,Answer()
exten => _X.,n,Wait(1)
exten => _X.,n,Playback(/var/lib/asterisk/sounds/outbound-message)
exten => _X.,n,Read(response,/var/lib/asterisk/sounds/yes-no-prompt,1)
exten => _X.,n,GotoIf($["${response}"="1"]?yes:no)
exten => _X.,n(yes),Verbose(1,Contact pressed YES - interested)
exten => _X.,n,System(curl -X POST http://shadowpbx-app:3000/api/outbound/ivr-response -H "Content-Type: application/json" -d '{"phone":"${EXTEN}","response":"yes"}')
exten => _X.,n,Hangup()
exten => _X.,n(no),Verbose(1,Contact pressed NO - not interested)
exten => _X.,n,System(curl -X POST http://shadowpbx-app:3000/api/outbound/ivr-response -H "Content-Type: application/json" -d '{"phone":"${EXTEN}","response":"no"}')
exten => _X.,n,Hangup()

[sip-trunk]
; SIP trunk for integration with ShadowPBX
exten => _X.,1,Dial(SIP/${EXTEN}@shadowpbx)
exten => _X.,n,Hangup()
