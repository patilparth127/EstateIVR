[general]
interval=15
; Audio settings
audio=/dev/dsp
audio-buffer=32
; SMS settings
sms=yes
; USSD settings
ussd=yes
; USSD timeout in seconds
ussdtimeout=2

[gsm1]
audio=/dev/dsp
data=/dev/ttyUSB0
; IMEI - auto-detected
; IMSI - auto-detected
; Use this device for outgoing calls
context=outbound-ivr
; RX gain in dB
rxgain=-5
; TX gain in dB
txgain=5
; Autostart the dongle
autostart=yes
; Use this device for SMS
sms=yes
; Use this device for USSD
ussd=yes
; Use this device for voice calls
voice=yes
; Call waiting
callwaiting=yes
; Call forwarding
callforwarding=yes
; Use this device for network registration
networksearch=yes
; Network name (optional)
; network=Vodafone IN
; PIN code (if required)
; pin=1234
